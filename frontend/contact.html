<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y·Plaza - Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>
  <!-- NAV -->
  <nav class="nav">
    <a class="nav-logo" onclick="goTo('home')">Y·PLAZA <span>IMMOBILIER</span></a>
    <div class="nav-links">
      <button class="nav-btn" onclick="goTo('home')">Accueil</button>
      <button class="nav-btn" onclick="goTo('annonces')">Annonces</button>
      <button class="nav-btn active" onclick="goTo('contact')">Contact</button>
      <button class="nav-btn" onclick="goTo('login')">Connexion</button>
    </div>
    <div class="nav-right">
      <span class="badge">Visiteur</span>
      <div class="avatar">?</div>
    </div>
  </nav>

  <!-- CONTACT PAGE -->
  <div class="contact-container">
    <form onsubmit="handleContact(event)">
      <h2 style="font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 1.5rem;">Nous contacter</h2>

      <label>Nom complet</label>
      <input type="text" placeholder="Jean Dupont" required>

      <label>Email</label>
      <input type="email" placeholder="jean@exemple.fr" required>

      <label>Téléphone</label>
      <input type="tel" placeholder="06 12 34 56 78">

      <label>Agence</label>
      <select required>
        <option value="">Sélectionnez une agence</option>
        <option value="aix">Aix-en-Provence (siège)</option>
        <option value="marseille">Marseille</option>
        <option value="lyon">Lyon</option>
        <option value="toulouse">Toulouse</option>
      </select>

      <label>Sujet</label>
      <select required>
        <option value="">Sélectionnez un sujet</option>
        <option value="information">Demande d'information</option>
        <option value="visite">Demande de visite</option>
        <option value="estimation">Demande d'estimation</option>
        <option value="vente">Vendre mon bien</option>
        <option value="autre">Autre</option>
      </select>

      <label>Message</label>
      <textarea placeholder="Votre message..." required></textarea>

      <button type="submit" class="btn-gold">Envoyer</button>
    </form>
  </div>

  <script src="js/router.js"></script>
  <script src="js/auth-guard.js"></script>
  <script>
    function handleContact(e) {
      e.preventDefault();
      alert('Merci pour votre message ! Nous vous recontacterons bientôt.');
      e.target.reset();
    }
  </script>
</body>
</html>
