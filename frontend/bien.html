<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y·Plaza - Détail du bien</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/bien.css">
</head>
<body>
  <!-- NAV -->
  <nav>
    <a class="logo" onclick="goTo('home')">Y·PLAZA <span>IMMOBILIER</span></a>
    <div class="nav-links">
      <button class="nav-btn" onclick="goTo('home')">Accueil</button>
      <button class="nav-btn" onclick="goTo('annonces')">Annonces</button>
      <button class="nav-btn" onclick="goTo('contact')">Contact</button>
      <button class="nav-btn" onclick="goTo('login')">Connexion</button>
    </div>
    <div class="nav-right">
      <span class="badge">Utilisateur</span>
      <div class="avatar">MR</div>
    </div>
  </nav>

  <!-- DETAIL PAGE -->
  <div class="detail-layout">
    <button class="back-btn" onclick="goTo('annonces')">← Retour aux annonces</button>
    <div class="detail-img">🏠</div>
    
    <div class="detail-header">
      <div>
        <div class="detail-title" id="detail-title">Appartement T4 lumineux</div>
        <div class="detail-loc" id="detail-loc">📍 Aix-en-Provence, 13100</div>
      </div>
      <div>
        <div class="detail-price" id="detail-price">380 000 €</div>
        <div class="detail-actions" style="margin-top:0.5rem;">
          <button class="btn-outline">♡ Favoris</button>
          <button class="btn-gold">Contacter l'agent</button>
        </div>
      </div>
    </div>

    <div class="detail-grid">
      <div class="detail-main">
        <h3>Caractéristiques</h3>
        <div class="specs-grid" id="detail-specs"></div>
        
        <h3>Description</h3>
        <p id="detail-desc">Magnifique appartement T4 entièrement rénové...</p>
        
        <h3>Estimation IA</h3>
        <div id="ai-section"></div>
      </div>

      <div>
        <div class="contact-card">
          <div class="agent-row">
            <div class="agent-avatar">MR</div>
            <div><div class="agent-name">Marie Renaud</div><div class="agent-agency">Agence Aix-en-Provence</div></div>
          </div>
          <div class="contact-form">
            <label>Votre nom</label>
            <input type="text" placeholder="Jean Dupont">
            <label>Email</label>
            <input type="email" placeholder="jean@exemple.fr">
            <label>Message</label>
            <textarea>Je souhaite obtenir plus d'informations sur ce bien et organiser une visite.</textarea>
            <button class="btn-gold" style="width:100%;margin-top:0.75rem;padding:0.75rem;">Envoyer</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/router.js"></script>
  <script src="js/bien.js"></script>
</body>
</html>
