<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y·Plaza - Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" onclick="goTo('home')">Y·PLAZA <span>IMMOBILIER</span></a>
    <div class="nav-links">
      <button class="nav-btn" onclick="goTo('home')">Accueil</button>
      <button class="nav-btn" onclick="goTo('annonces')">Annonces</button>
      <button class="nav-btn" onclick="goTo('contact')">Contact</button>
      <button class="nav-btn active" onclick="goTo('login')">Connexion</button>
    </div>
    <div class="nav-right">
      <span class="badge">Visiteur</span>
      <div class="avatar">?</div>
    </div>
  </nav>

  <div class="login-container">
    <form class="login-form" onsubmit="handleLogin(event)">
      <h2>Connexion</h2>
      <label>Email</label>
      <input type="email" placeholder="marie.renaud@yplaza.fr" required>
      <label>Mot de passe</label>
      <input type="password" placeholder="••••••••" required>
      <button type="submit" class="btn-gold">Se connecter</button>
      <div class="login-links">
        <a href="#">Mot de passe oublié ?</a><br>
        <a href="#">Créer un compte</a>
      </div>
    </form>

  <script src="js/router.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
