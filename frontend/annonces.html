<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y·Plaza - Annonces</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/annonces.css">
</head>
<body>
  <!-- NAV -->
  <nav class="nav">
    <a class="nav-logo" onclick="goTo('home')">Y·PLAZA <span>IMMOBILIER</span></a>
    <div class="nav-links">
      <button class="nav-btn" onclick="goTo('home')">Accueil</button>
      <button class="nav-btn" onclick="goTo('annonces')">Annonces</button>
      <button class="nav-btn active" onclick="goTo('contact')">Contact</button>
      <button class="nav-btn" onclick="goTo('login')">Connexion</button>
    </div>
    <div class="nav-right">
      <span class="badge">Visiteur</span>
      <div class="avatar">?</div>
    </div>
  </nav>

  <div class="section">
    <div class="section-header">
      <div>
        <div class="section-title">Biens immobiliers</div>
        <div class="count-tag" id="count-tag">Chargement...</div>
      </div>
      <select class="sort-select" onchange="sortProps(this.value)">
        <option value="recent">Plus récent</option>
        <option value="price-asc">Prix croissant</option>
        <option value="price-desc">Prix décroissant</option>
        <option value="surface">Surface</option>
      </select>
    </div>

    <div class="filters-container">
      <div class="filter-group">
        <label>Type de bien</label>
        <select id="filter-type" onchange="window.annoncesPage && window.annoncesPage.filterProperties()">
          <option value="">Tous les types</option>
          <option value="APPARTEMENT">Appartement</option>
          <option value="MAISON">Maison</option>
          <option value="BUREAU">Bureau</option>
          <option value="COMMERCE">Commerce</option>
          <option value="TERRAIN">Terrain</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Type d'annonce</label>
        <select id="filter-listing" onchange="window.annoncesPage && window.annoncesPage.filterProperties()">
          <option value="">Vente & Location</option>
          <option value="VENTE">Vente</option>
          <option value="LOCATION">Location</option>
        </select>
      </div>
    </div>

    <div class="listings-grid" id="listings"></div>
  </div>

  <script src="js/router.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/annonces.js"></script>
</body>
</html>
